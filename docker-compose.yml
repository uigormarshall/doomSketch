services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    image: doomsketch-app:latest
    restart: unless-stopped
    environment:
      # Só o app aplica migrations; defina SEED_DEMO=true para popular dados de teste.
      RUN_MIGRATIONS: "true"
      SEED_DEMO: "false"
      # Sobrescreve o APP_URL sem precisar rebuildar (ex.: APP_URL=http://SEU_IP docker compose up).
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      - storage-uploads:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "9000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: doomsketch-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      # nginx serve as imagens enviadas (somente leitura) do mesmo volume do app.
      - storage-uploads:/var/www/html/storage/app/public:ro
    depends_on:
      - app

  worker:
    image: doomsketch-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_URL: ${APP_URL:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  scheduler:
    image: doomsketch-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_URL: ${APP_URL:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: doomsketch
      MYSQL_USER: doomsketch
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    expose:
      - "3306"

volumes:
  db-data:
  storage-uploads:
