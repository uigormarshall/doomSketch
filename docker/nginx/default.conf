server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25M;

    # Resolver embutido do Docker: resolve o upstream em runtime e evita o
    # "host not found in upstream app" quando o web sobe antes do container app.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Arte enviada (disco "public") servida a partir do volume compartilhado.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Bloqueia dotfiles (exceto .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
